[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servidor-mcp"
version = "1.0.0"
description = "Servidor MCP da central de salas da Hill Valley Tech"
requires-python = ">=3.10"
dependencies = ["mcp==2.3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["servidor_mcp*"]
